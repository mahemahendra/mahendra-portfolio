<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181e24"/>
      <stop offset="100%" stop-color="#0f1317"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34b7a7"/>
      <stop offset="100%" stop-color="#248a7e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="12" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Title Badge -->
  <rect x="40" y="30" width="220" height="30" rx="15" fill="#34b7a7" fill-opacity="0.15" stroke="#34b7a7" stroke-width="1"/>
  <text x="55" y="50" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#34b7a7" letter-spacing="1">ESG INTELLIGENCE &amp; DATA ENGINE</text>
  <text x="40" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Automated Carbon Accounting &amp; Reconciliation</text>

  <!-- Topology Nodes -->
  <!-- Node 1: Ingestion & ETL -->
  <g filter="url(#shadow)">
    <rect x="40" y="140" width="200" height="280" rx="8" fill="#222b34" stroke="#344352" stroke-width="1.5"/>
    <rect x="40" y="140" width="200" height="40" rx="8" fill="#2a3642"/>
    <circle cx="65" cy="160" r="8" fill="#34b7a7"/>
    <text x="85" y="165" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">1. Data Ingestion &amp; ETL</text>
    
    <rect x="55" y="200" width="170" height="45" rx="5" fill="#181e24" stroke="#344352" stroke-width="1"/>
    <text x="70" y="222" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e0e0e0">Heterogeneous Feeds</text>
    <text x="70" y="235" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8c9aa6">IoT Sensors &amp; ERP Bills</text>

    <rect x="55" y="260" width="170" height="45" rx="5" fill="#181e24" stroke="#344352" stroke-width="1"/>
    <text x="70" y="282" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e0e0e0">Batch &amp; Stream Parser</text>
    <text x="70" y="295" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8c9aa6">Schema Normalizer</text>

    <rect x="55" y="320" width="170" height="70" rx="5" fill="#181e24" stroke="#344352" stroke-width="1"/>
    <text x="70" y="342" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#34b7a7">Validation Proxy</text>
    <text x="70" y="358" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8c9aa6">PII Scrubbing</text>
    <text x="70" y="373" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8c9aa6">Unit Standardization</text>
  </g>

  <!-- Flow Arrow 1 to 2 -->
  <path d="M 240 280 L 295 280" stroke="#34b7a7" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <polygon points="300,280 292,276 292,284" fill="#34b7a7"/>

  <!-- Node 2: Core Processing / Microservices -->
  <g filter="url(#shadow)">
    <rect x="300" y="140" width="200" height="280" rx="8" fill="#222b34" stroke="#34b7a7" stroke-width="1.5"/>
    <rect x="300" y="140" width="200" height="40" rx="8" fill="url(#tealGrad)"/>
    <text x="320" y="165" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">2. Processing &amp; Microservices</text>

    <rect x="315" y="200" width="170" height="50" rx="5" fill="#181e24" stroke="#344352" stroke-width="1"/>
    <text x="330" y="222" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e0e0e0">Spring Boot Microservices</text>
    <text x="330" y="238" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#34b7a7">Domain Business Logic</text>

    <rect x="315" y="265" width="170" height="50" rx="5" fill="#181e24" stroke="#344352" stroke-width="1"/>
    <text x="330" y="287" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e0e0e0">Reconciliation Engine</text>
    <text x="330" y="303" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8c9aa6">GHG Protocol Scope 1-3</text>

    <rect x="315" y="330" width="170" height="60" rx="5" fill="#181e24" stroke="#344352" stroke-width="1"/>
    <text x="330" y="352" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e0e0e0">Agentic Extraction Loop</text>
    <text x="330" y="368" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8c9aa6">LangGraph State Machine</text>
  </g>

  <!-- Flow Arrow 2 to 3 -->
  <path d="M 500 280 L 555 280" stroke="#34b7a7" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <polygon points="560,280 552,276 552,284" fill="#34b7a7"/>

  <!-- Node 3: Storage, Cloud & Delivery -->
  <g filter="url(#shadow)">
    <rect x="560" y="140" width="200" height="280" rx="8" fill="#222b34" stroke="#344352" stroke-width="1.5"/>
    <rect x="560" y="140" width="200" height="40" rx="8" fill="#2a3642"/>
    <circle cx="585" cy="160" r="8" fill="#34b7a7"/>
    <text x="605" y="165" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">3. Cloud &amp; Analytics</text>

    <rect x="575" y="200" width="170" height="50" rx="5" fill="#181e24" stroke="#344352" stroke-width="1"/>
    <text x="590" y="222" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e0e0e0">GCP Cloud SQL (Postgres)</text>
    <text x="590" y="238" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8c9aa6">Partitioned Audit Store</text>

    <rect x="575" y="265" width="170" height="50" rx="5" fill="#181e24" stroke="#344352" stroke-width="1"/>
    <text x="590" y="287" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e0e0e0">Audit &amp; Compliance Logs</text>
    <text x="590" y="303" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8c9aa6">Immutable Verification</text>

    <rect x="575" y="330" width="170" height="60" rx="5" fill="#181e24" stroke="#344352" stroke-width="1"/>
    <text x="590" y="352" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#34b7a7">Executive Dashboards</text>
    <text x="590" y="368" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8c9aa6">React / HighCharts Visuals</text>
  </g>

  <!-- Metric Badges Bottom -->
  <g transform="translate(40, 445)">
    <rect x="0" y="0" width="220" height="36" rx="6" fill="#181e24" stroke="#344352" stroke-width="1"/>
    <text x="15" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8c9aa6">Cycle Time: <tspan font-weight="700" fill="#34b7a7">65% Reduction</tspan></text>
  </g>

  <g transform="translate(290, 445)">
    <rect x="0" y="0" width="220" height="36" rx="6" fill="#181e24" stroke="#344352" stroke-width="1"/>
    <text x="15" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8c9aa6">Data Integrity: <tspan font-weight="700" fill="#34b7a7">Zero Schema Errors</tspan></text>
  </g>

  <g transform="translate(540, 445)">
    <rect x="0" y="0" width="220" height="36" rx="6" fill="#181e24" stroke="#344352" stroke-width="1"/>
    <text x="15" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8c9aa6">Platform: <tspan font-weight="700" fill="#34b7a7">GCP / Spring Boot / SQL</tspan></text>
  </g>
</svg>
