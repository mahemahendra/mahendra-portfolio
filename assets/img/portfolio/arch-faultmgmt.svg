<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181e24"/>
      <stop offset="100%" stop-color="#0f1317"/>
    </linearGradient>
    <linearGradient id="blueTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3c72"/>
      <stop offset="100%" stop-color="#34b7a7"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="12" fill="url(#bgGrad3)"/>
  
  <!-- Subtle Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Title Badge -->
  <rect x="40" y="30" width="240" height="30" rx="15" fill="#34b7a7" fill-opacity="0.15" stroke="#34b7a7" stroke-width="1"/>
  <text x="55" y="50" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#34b7a7" letter-spacing="1">DISTRIBUTED CLOUD &amp; MEDIA</text>
  <text x="40" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#ffffff">High-Concurrency Fault Management &amp; Discovery Engine</text>

  <!-- Topology Nodes -->
  <!-- Node 1: Broadcast & Media Streams -->
  <g filter="url(#shadow3)">
    <rect x="40" y="140" width="200" height="280" rx="8" fill="#222b34" stroke="#344352" stroke-width="1.5"/>
    <rect x="40" y="140" width="200" height="40" rx="8" fill="#2a3642"/>
    <circle cx="65" cy="160" r="8" fill="#34b7a7"/>
    <text x="85" y="165" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">1. Stream &amp; Signal Ingress</text>

    <rect x="55" y="200" width="170" height="45" rx="5" fill="#181e24" stroke="#344352" stroke-width="1"/>
    <text x="70" y="222" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e0e0e0">MCR Broadcast Feeds</text>
    <text x="70" y="235" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8c9aa6">Telemetry &amp; status beacons</text>

    <rect x="55" y="260" width="170" height="45" rx="5" fill="#181e24" stroke="#344352" stroke-width="1"/>
    <text x="70" y="282" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e0e0e0">OTT Catalog &amp; Metadata</text>
    <text x="70" y="295" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8c9aa6">Multi-provider ingestion</text>

    <rect x="55" y="320" width="170" height="70" rx="5" fill="#181e24" stroke="#344352" stroke-width="1"/>
    <text x="70" y="342" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#34b7a7">Health Probes</text>
    <text x="70" y="358" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8c9aa6">Real-time bitstream checks</text>
    <text x="70" y="373" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8c9aa6">Fault pulse heartbeat</text>
  </g>

  <!-- Flow Arrow 1 to 2 -->
  <path d="M 240 280 L 295 280" stroke="#34b7a7" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <polygon points="300,280 292,276 292,284" fill="#34b7a7"/>

  <!-- Node 2: Fault Engine & Redis Cache -->
  <g filter="url(#shadow3)">
    <rect x="300" y="140" width="200" height="280" rx="8" fill="#222b34" stroke="#34b7a7" stroke-width="1.5"/>
    <rect x="300" y="140" width="200" height="40" rx="8" fill="url(#blueTealGrad)"/>
    <text x="320" y="165" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">2. Fault Engine &amp; Cache</text>

    <rect x="315" y="200" width="170" height="50" rx="5" fill="#181e24" stroke="#344352" stroke-width="1"/>
    <text x="330" y="222" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e0e0e0">Distributed Event Broker</text>
    <text x="330" y="238" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#34b7a7">Asynchronous failover queue</text>

    <rect x="315" y="265" width="170" height="50" rx="5" fill="#181e24" stroke="#344352" stroke-width="1"/>
    <text x="330" y="287" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e0e0e0">Redis Tiered Semantic Cache</text>
    <text x="330" y="303" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8c9aa6">Sub-10ms query lookup</text>

    <rect x="315" y="330" width="170" height="60" rx="5" fill="#181e24" stroke="#344352" stroke-width="1"/>
    <text x="330" y="352" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e0e0e0">Automated Remediation</text>
    <text x="330" y="368" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8c9aa6">Instant channel failover routing</text>
  </g>

  <!-- Flow Arrow 2 to 3 -->
  <path d="M 500 280 L 555 280" stroke="#34b7a7" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <polygon points="560,280 552,276 552,284" fill="#34b7a7"/>

  <!-- Node 3: MCR Console & OTT Experience -->
  <g filter="url(#shadow3)">
    <rect x="560" y="140" width="200" height="280" rx="8" fill="#222b34" stroke="#344352" stroke-width="1.5"/>
    <rect x="560" y="140" width="200" height="40" rx="8" fill="#2a3642"/>
    <circle cx="585" cy="160" r="8" fill="#34b7a7"/>
    <text x="605" y="165" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">3. Operational Delivery</text>

    <rect x="575" y="200" width="170" height="50" rx="5" fill="#181e24" stroke="#344352" stroke-width="1"/>
    <text x="590" y="222" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e0e0e0">Master Control Room UI</text>
    <text x="590" y="238" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8c9aa6">W2Grid / High-density telemetry</text>

    <rect x="575" y="265" width="170" height="50" rx="5" fill="#181e24" stroke="#344352" stroke-width="1"/>
    <text x="590" y="287" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e0e0e0">Binge Media Discovery</text>
    <text x="590" y="303" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8c9aa6">High-concurrency aggregation</text>

    <rect x="575" y="330" width="170" height="60" rx="5" fill="#181e24" stroke="#344352" stroke-width="1"/>
    <text x="590" y="352" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#34b7a7">Automated Reporting</text>
    <text x="590" y="368" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8c9aa6">99.999% SLA Compliance</text>
  </g>

  <!-- Metric Badges Bottom -->
  <g transform="translate(40, 445)">
    <rect x="0" y="0" width="220" height="36" rx="6" fill="#181e24" stroke="#344352" stroke-width="1"/>
    <text x="15" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8c9aa6">Availability: <tspan font-weight="700" fill="#34b7a7">99.999% SLA</tspan></text>
  </g>

  <g transform="translate(290, 445)">
    <rect x="0" y="0" width="220" height="36" rx="6" fill="#181e24" stroke="#344352" stroke-width="1"/>
    <text x="15" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8c9aa6">Failover Latency: <tspan font-weight="700" fill="#34b7a7">&lt; 200ms Switch</tspan></text>
  </g>

  <g transform="translate(540, 445)">
    <rect x="0" y="0" width="220" height="36" rx="6" fill="#181e24" stroke="#344352" stroke-width="1"/>
    <text x="15" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8c9aa6">Concurrency: <tspan font-weight="700" fill="#34b7a7">Millions of Active Streams</tspan></text>
  </g>
</svg>
