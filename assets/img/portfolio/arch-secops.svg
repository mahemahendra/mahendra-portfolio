<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181e24"/>
      <stop offset="100%" stop-color="#0f1317"/>
    </linearGradient>
    <linearGradient id="redTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#34b7a7"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="12" fill="url(#bgGrad2)"/>
  
  <!-- Subtle Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Title Badge -->
  <rect x="40" y="30" width="240" height="30" rx="15" fill="#34b7a7" fill-opacity="0.15" stroke="#34b7a7" stroke-width="1"/>
  <text x="55" y="50" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#34b7a7" letter-spacing="1">THREAT &amp; NETWORK TELEMETRY</text>
  <text x="40" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Agentic SecOps &amp; Geo-Distributed Threat Pipeline</text>

  <!-- Topology Nodes -->
  <!-- Node 1: Ingress Packet Sensors -->
  <g filter="url(#shadow2)">
    <rect x="40" y="140" width="200" height="280" rx="8" fill="#222b34" stroke="#344352" stroke-width="1.5"/>
    <rect x="40" y="140" width="200" height="40" rx="8" fill="#2a3642"/>
    <circle cx="65" cy="160" r="8" fill="#34b7a7"/>
    <text x="85" y="165" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">1. Packet &amp; Flow Ingress</text>

    <rect x="55" y="200" width="170" height="45" rx="5" fill="#181e24" stroke="#344352" stroke-width="1"/>
    <text x="70" y="222" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e0e0e0">Global Sensor Probes</text>
    <text x="70" y="235" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8c9aa6">Line-rate packet capture</text>

    <rect x="55" y="260" width="170" height="45" rx="5" fill="#181e24" stroke="#344352" stroke-width="1"/>
    <text x="70" y="282" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e0e0e0">Geo-IP Tagging Engine</text>
    <text x="70" y="295" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8c9aa6">Autonomous spatial lookup</text>

    <rect x="55" y="320" width="170" height="70" rx="5" fill="#181e24" stroke="#344352" stroke-width="1"/>
    <text x="70" y="342" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#34b7a7">Anomaly Pre-Filter</text>
    <text x="70" y="358" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8c9aa6">Signature matching</text>
    <text x="70" y="373" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8c9aa6">Volumetric DDoS alerts</text>
  </g>

  <!-- Flow Arrow 1 to 2 -->
  <path d="M 240 280 L 295 280" stroke="#34b7a7" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <polygon points="300,280 292,276 292,284" fill="#34b7a7"/>

  <!-- Node 2: Omnis Threat Investigator Core -->
  <g filter="url(#shadow2)">
    <rect x="300" y="140" width="200" height="280" rx="8" fill="#222b34" stroke="#34b7a7" stroke-width="1.5"/>
    <rect x="300" y="140" width="200" height="40" rx="8" fill="url(#redTealGrad)"/>
    <text x="320" y="165" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">2. Investigator Core &amp; SIEM</text>

    <rect x="315" y="200" width="170" height="50" rx="5" fill="#181e24" stroke="#344352" stroke-width="1"/>
    <text x="330" y="222" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e0e0e0">Correlation Pipeline</text>
    <text x="330" y="238" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#34b7a7">Stateful Session Tracking</text>

    <rect x="315" y="265" width="170" height="50" rx="5" fill="#181e24" stroke="#344352" stroke-width="1"/>
    <text x="330" y="287" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e0e0e0">SIEM Hub Integration</text>
    <text x="330" y="303" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8c9aa6">Splunk, QRadar, Sentinel</text>

    <rect x="315" y="330" width="170" height="60" rx="5" fill="#181e24" stroke="#344352" stroke-width="1"/>
    <text x="330" y="352" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e0e0e0">Triage Intelligence</text>
    <text x="330" y="368" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8c9aa6">Automated Root Cause Triage</text>
  </g>

  <!-- Flow Arrow 2 to 3 -->
  <path d="M 500 280 L 555 280" stroke="#34b7a7" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <polygon points="560,280 552,276 552,284" fill="#34b7a7"/>

  <!-- Node 3: Geo Footprint & SOC Console -->
  <g filter="url(#shadow2)">
    <rect x="560" y="140" width="200" height="280" rx="8" fill="#222b34" stroke="#344352" stroke-width="1.5"/>
    <rect x="560" y="140" width="200" height="40" rx="8" fill="#2a3642"/>
    <circle cx="585" cy="160" r="8" fill="#34b7a7"/>
    <text x="605" y="165" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">3. Geo Footprint Console</text>

    <rect x="575" y="200" width="170" height="50" rx="5" fill="#181e24" stroke="#344352" stroke-width="1"/>
    <text x="590" y="222" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e0e0e0">HighCharts &amp; WebGL Map</text>
    <text x="590" y="238" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8c9aa6">Real-time geospatial heatmaps</text>

    <rect x="575" y="265" width="170" height="50" rx="5" fill="#181e24" stroke="#344352" stroke-width="1"/>
    <text x="590" y="287" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e0e0e0">Incident Quarantine Action</text>
    <text x="590" y="303" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8c9aa6">Policy enforcement triggers</text>

    <rect x="575" y="330" width="170" height="60" rx="5" fill="#181e24" stroke="#344352" stroke-width="1"/>
    <text x="590" y="352" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#34b7a7">React / Redux Front End</text>
    <text x="590" y="368" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8c9aa6">Sub-second state reconciliation</text>
  </g>

  <!-- Metric Badges Bottom -->
  <g transform="translate(40, 445)">
    <rect x="0" y="0" width="220" height="36" rx="6" fill="#181e24" stroke="#344352" stroke-width="1"/>
    <text x="15" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8c9aa6">Packet Telemetry: <tspan font-weight="700" fill="#34b7a7">Sub-second Triage</tspan></text>
  </g>

  <g transform="translate(290, 445)">
    <rect x="0" y="0" width="220" height="36" rx="6" fill="#181e24" stroke="#344352" stroke-width="1"/>
    <text x="15" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8c9aa6">SIEM Federation: <tspan font-weight="700" fill="#34b7a7">Zero Data Loss</tspan></text>
  </g>

  <g transform="translate(540, 445)">
    <rect x="0" y="0" width="220" height="36" rx="6" fill="#181e24" stroke="#344352" stroke-width="1"/>
    <text x="15" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8c9aa6">Scale: <tspan font-weight="700" fill="#34b7a7">10M+ Packet Flows/sec</tspan></text>
  </g>
</svg>
